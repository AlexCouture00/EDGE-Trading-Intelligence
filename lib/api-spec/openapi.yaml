openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: EDGE Trading Intelligence
servers:
  - url: /api
security:
  - PersonalBearer: []
paths:
  /edge/prop-manager:
    get:
      operationId: getPropManager
      responses:
        "200":
          description: Private persisted prop firm portfolio. Monetary totals are never combined across currencies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropPortfolio" }
        "503": { description: Prop manager migration has not been applied }
  /edge/prop-manager/{kind}:
    parameters:
      - $ref: "#/components/parameters/PropKind"
    post:
      operationId: createPropRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropRecordInput" }
      responses:
        "201":
          description: Created; refetch the portfolio for recalculated totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropSaved" }
        "400": { description: Invalid attributes }
        "404": { description: Related record not found for the current owner }
  /edge/prop-manager/{kind}/{id}:
    parameters:
      - $ref: "#/components/parameters/PropKind"
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updatePropRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropRecordInput" }
      responses:
        "200":
          description: Updated; balance snapshots are append-only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropSaved" }
        "400": { description: Invalid attributes }
        "404": { description: Not found for current owner }
        "409": { description: Historical identity cannot be rewritten }
    delete:
      operationId: deletePropRecord
      responses:
        "204": { description: "Expense, payout or rule removed" }
        "404": { description: Not found for current owner }
        "409": { description: Archive firms and accounts; retain balance and challenge histories }
  /edge/day-notes:
    get:
      operationId: listDayNotes
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: to, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Daily reflections in the inclusive date range
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DayNote" } }
        "400": { description: Invalid date range }
  /edge/day-notes/{day}:
    parameters:
      - { name: day, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
    put:
      operationId: saveDayNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DayNoteInput" }
      responses:
        "200":
          description: Saved daily reflection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayNote" }
        "400": { description: Invalid date or note }
    delete:
      operationId: deleteDayNote
      responses:
        "204": { description: Daily reflection removed if present }
        "400": { description: Invalid date }
  /auth/session:
    get:
      operationId: getPrivateSession
      description: Returns the single authorized Supabase user; rejects every other identity.
      responses:
        "200":
          description: Authorized journal owner
          content:
            application/json:
              schema:
                type: object
                required: [id, email]
                properties:
                  id: { type: string, format: uuid }
                  email: { type: [string, "null"] }
        "401":
          description: Missing, invalid or expired Supabase session
        "403":
          description: Authenticated user is not the authorized owner
        "503":
          description: Authentication is unconfigured or temporarily unavailable
  /healthz:
    get:
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /edge/accounts:
    get:
      operationId: listAccounts
      parameters:
        - $ref: "#/components/parameters/Demo"
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Account" } }
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /edge/accounts/{id}:
    patch:
      operationId: updateAccount
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /edge/accounts/{id}/cash-flows:
    get:
      operationId: listCashFlows
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Demo"
      responses:
        "200":
          description: Flows
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CashFlow" } }
    post:
      operationId: createCashFlow
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashFlowInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashFlow" }
  /edge/confluences:
    get:
      operationId: listConfluences
      parameters:
        - $ref: "#/components/parameters/Demo"
      responses:
        "200":
          description: Confluences
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Confluence" } }
    post:
      operationId: createConfluence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfluenceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Confluence" }
  /edge/confluences/{id}:
    patch:
      operationId: updateConfluence
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfluenceInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Confluence" }
  /edge/strategies:
    get:
      operationId: listStrategies
      parameters:
        - $ref: "#/components/parameters/Demo"
      responses:
        "200":
          description: Strategies
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Strategy" } }
    post:
      operationId: createStrategy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StrategyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Strategy" }
  /edge/strategies/{id}:
    patch:
      operationId: updateStrategy
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StrategyInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Strategy" }
  /edge/trades:
    get:
      operationId: listTrades
      parameters:
        - $ref: "#/components/parameters/Demo"
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/TradeCurrency"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/StrategyId"
        - $ref: "#/components/parameters/Direction"
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Trades
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Trade" } }
    post:
      operationId: createTrade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trade" }
  /edge/trades/{id}:
    get:
      operationId: getTrade
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Demo"
      responses:
        "200":
          description: Trade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trade" }
    put:
      operationId: updateTrade
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trade" }
    delete:
      operationId: deleteTrade
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }
  /edge/analytics:
    get:
      operationId: getAnalytics
      parameters:
        - $ref: "#/components/parameters/Demo"
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/TradeCurrency"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/StrategyId"
        - $ref: "#/components/parameters/Direction"
        - { name: confluenceIds, in: query, description: Comma-separated UUIDs, schema: { type: string } }
        - { name: matchMode, in: query, schema: { type: string, enum: [exact, containsAll] } }
        - { name: minSample, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: Analytics computed only from persisted closed trades
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analytics" }
  /edge/settings:
    get:
      operationId: getSettings
      parameters:
        - $ref: "#/components/parameters/Demo"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    put:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
components:
  securitySchemes:
    PersonalBearer:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
  parameters:
    PropKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [firms, accounts, balances, challenges, rules, expenses, payouts] }
    Demo: { name: demo, in: query, schema: { type: boolean }, description: Read-only isolated example dataset }
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    AccountId: { name: accountId, in: query, schema: { type: string } }
    TradeCurrency: { name: currency, in: query, description: Report all journal trades denominated in this currency without combining currencies., schema: { type: string, pattern: "^[A-Z]{3}$" } }
    From: { name: from, in: query, schema: { type: string, format: date-time } }
    To: { name: to, in: query, schema: { type: string, format: date-time } }
    Symbol: { name: symbol, in: query, schema: { type: string } }
    StrategyId: { name: strategyId, in: query, schema: { type: string } }
    Direction: { name: direction, in: query, schema: { type: string, enum: [long, short] } }
  schemas:
    PropMoney:
      type: string
      pattern: '^-?\d{1,16}(\.\d{1,8})?$'
      description: Exact decimal amount, never a binary floating point monetary input.
    PropDay:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
    PropSaved:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    PropFirmInput:
      type: object
      additionalProperties: false
      required: [name, website, marketType, platform, notes, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        website: { type: string, maxLength: 1000 }
        marketType: { type: string, enum: [CFD, Futures, Perpetuals] }
        platform: { type: string, maxLength: 150 }
        notes: { type: string, maxLength: 10000 }
        status: { type: string, enum: [active, archived] }
    PropAccountInput:
      type: object
      additionalProperties: false
      required: [firmId, name, reference, marketType, platform, currency, nominalSize, startingBalance, purchasedOn, status, phase, journalAccountId, notes]
      properties:
        firmId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 150 }
        reference: { type: string, maxLength: 150 }
        marketType: { type: string, enum: [CFD, Futures, Perpetuals] }
        platform: { type: string, maxLength: 150 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        nominalSize: { $ref: "#/components/schemas/PropMoney" }
        startingBalance: { $ref: "#/components/schemas/PropMoney" }
        purchasedOn: { $ref: "#/components/schemas/PropDay" }
        status: { type: string, enum: [not_started, evaluation, funded, passed, failed, expired, closed, archived] }
        phase: { type: string, maxLength: 150, description: Phase is separate from account lifecycle and payout status. }
        journalAccountId: { type: [string, "null"], format: uuid }
        notes: { type: string, maxLength: 10000 }
    PropBalanceInput:
      type: object
      additionalProperties: false
      required: [accountId, balance, equity, note]
      properties:
        accountId: { type: string, format: uuid }
        recordedOn:
          allOf: [{ $ref: "#/components/schemas/PropDay" }]
          description: Effective balance date, not the time this entry was added. Defaults to the UTC insertion date for older clients. Future dates are not allowed.
        balance: { $ref: "#/components/schemas/PropMoney" }
        equity: { type: [string, "null"], pattern: '^-?\d{1,16}(\.\d{1,8})?$' }
        note: { type: string, maxLength: 10000 }
    PropChallengeInput:
      type: object
      additionalProperties: false
      required: [accountId, name, structure, phase, startingBalance, profitTarget, maximumLoss, dailyLoss, minimumDays, completedDays, startDate, expiresOn, status, notes]
      properties:
        accountId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 150 }
        structure: { type: string, enum: [one_step, two_step, multi_step, instant_funded, custom] }
        phase: { type: string, minLength: 1, maxLength: 150 }
        startingBalance: { $ref: "#/components/schemas/PropMoney" }
        profitTarget: { $ref: "#/components/schemas/PropMoney" }
        maximumLoss: { $ref: "#/components/schemas/PropMoney" }
        dailyLoss: { type: [string, "null"], pattern: '^\d{1,16}(\.\d{1,8})?$' }
        minimumDays: { type: integer, minimum: 0, maximum: 100000 }
        completedDays: { type: integer, minimum: 0, maximum: 100000, description: Manually confirmed trading days; never inferred from balance snapshots. }
        startDate: { $ref: "#/components/schemas/PropDay" }
        expiresOn: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        status: { type: string, enum: [not_started, active, passed, failed, expired] }
        notes: { type: string, maxLength: 10000 }
    PropRuleInput:
      type: object
      additionalProperties: false
      required: [accountId, name, category, value, unit, method, explanation, effectiveDate, sourceUrl, verifiedOn, notes, confirmed]
      properties:
        accountId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 150 }
        category: { type: string, enum: [risk, trading, payout] }
        value: { type: string, minLength: 1, maxLength: 2000 }
        unit: { type: string, maxLength: 100 }
        method:
          type: string
          enum: [static_balance_loss, trailing_balance_loss, daily_loss, eod_trailing, intraday_trailing, equity_loss, max_position_size, max_contract_size, news, weekend, overnight, minimum_days, maximum_days, consistency, maximum_daily_profit, restricted_instruments, restricted_hours, minimum_payout, profit_split, payout_frequency, minimum_profitable_days, payout_eligibility, payout_cap, buffer, custom]
        explanation: { type: string, maxLength: 10000 }
        effectiveDate: { $ref: "#/components/schemas/PropDay" }
        sourceUrl: { type: string, maxLength: 1000 }
        verifiedOn: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        notes: { type: string, maxLength: 10000 }
        confirmed: { type: boolean }
    PropExpenseInput:
      type: object
      additionalProperties: false
      required: [firmId, accountId, category, amount, currency, date, notes]
      properties:
        firmId: { type: string, format: uuid }
        accountId: { type: [string, "null"], format: uuid }
        category: { type: string, enum: [challenge_purchase, challenge_reset, activation, subscription, platform, data, withdrawal, other] }
        amount: { $ref: "#/components/schemas/PropMoney" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        date: { $ref: "#/components/schemas/PropDay" }
        notes: { type: string, maxLength: 10000 }
    PropPayoutInput:
      type: object
      additionalProperties: false
      required: [accountId, grossProfit, profitSplit, requestedAmount, netReceived, currency, requestedOn, paidOn, status, processingFee, notes]
      properties:
        accountId: { type: string, format: uuid }
        grossProfit: { type: [string, "null"], pattern: '^\d{1,16}(\.\d{1,8})?$' }
        profitSplit: { type: [string, "null"], pattern: '^\d{1,3}(\.\d{1,4})?$' }
        requestedAmount: { $ref: "#/components/schemas/PropMoney" }
        netReceived: { $ref: "#/components/schemas/PropMoney" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        requestedOn: { $ref: "#/components/schemas/PropDay" }
        paidOn: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        status: { type: string, enum: [requested, approved, paid, rejected, cancelled] }
        processingFee: { $ref: "#/components/schemas/PropMoney" }
        notes: { type: string, maxLength: 10000 }
    PropRecordInput:
      oneOf:
        - { $ref: "#/components/schemas/PropFirmInput" }
        - { $ref: "#/components/schemas/PropAccountInput" }
        - { $ref: "#/components/schemas/PropBalanceInput" }
        - { $ref: "#/components/schemas/PropChallengeInput" }
        - { $ref: "#/components/schemas/PropRuleInput" }
        - { $ref: "#/components/schemas/PropExpenseInput" }
        - { $ref: "#/components/schemas/PropPayoutInput" }
    PropFirm:
      allOf:
        - { $ref: "#/components/schemas/PropFirmInput" }
        - { $ref: "#/components/schemas/PropSaved" }
    PropAccount:
      allOf:
        - { $ref: "#/components/schemas/PropAccountInput" }
        - { $ref: "#/components/schemas/PropSaved" }
    PropBalance:
      allOf:
        - { $ref: "#/components/schemas/PropBalanceInput" }
        - type: object
          required: [id, previousBalance, difference, createdAt]
          properties:
            id: { type: string, format: uuid }
            previousBalance: { $ref: "#/components/schemas/PropMoney" }
            difference: { type: string, pattern: '^-?\d{1,17}(\.\d{1,8})?$' }
            createdAt: { type: string, description: Server insertion timestamp retained for audit and ordering entries on the same balance date. }
    PropChallenge:
      allOf:
        - { $ref: "#/components/schemas/PropChallengeInput" }
        - { $ref: "#/components/schemas/PropSaved" }
        - type: object
          required: [closingBalance, completedAt]
          properties:
            closingBalance: { type: [string, "null"] }
            completedAt: { type: [string, "null"] }
    PropRule:
      allOf:
        - { $ref: "#/components/schemas/PropRuleInput" }
        - { $ref: "#/components/schemas/PropSaved" }
    PropExpense:
      allOf:
        - { $ref: "#/components/schemas/PropExpenseInput" }
        - { $ref: "#/components/schemas/PropSaved" }
    PropPayout:
      allOf:
        - { $ref: "#/components/schemas/PropPayoutInput" }
        - { $ref: "#/components/schemas/PropSaved" }
    PropPortfolio:
      type: object
      required: [firms, accounts, balances, challenges, rules, expenses, payouts]
      properties:
        firms: { type: array, items: { $ref: "#/components/schemas/PropFirm" } }
        accounts: { type: array, items: { $ref: "#/components/schemas/PropAccount" } }
        balances: { type: array, items: { $ref: "#/components/schemas/PropBalance" } }
        challenges: { type: array, items: { $ref: "#/components/schemas/PropChallenge" } }
        rules: { type: array, items: { $ref: "#/components/schemas/PropRule" } }
        expenses: { type: array, items: { $ref: "#/components/schemas/PropExpense" } }
        payouts: { type: array, items: { $ref: "#/components/schemas/PropPayout" } }
    DayNoteInput:
      type: object
      required: [wentWell, wentBadly]
      properties:
        wentWell: { type: string, maxLength: 10000 }
        wentBadly: { type: string, maxLength: 10000 }
    DayNote:
      type: object
      required: [day, wentWell, wentBadly, updatedAt]
      properties:
        day: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: Calendar day, never a timestamp }
        wentWell: { type: string }
        wentBadly: { type: string }
        updatedAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    AccountInput:
      type: object
      required: [name, currency, initialBalance, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        broker: { type: string, maxLength: 100 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        initialBalance: { type: string, pattern: "^\\d+(\\.\\d{1,8})?$" }
        type: { type: string, enum: [personal_live, demo, prop_evaluation, prop_funded, backtesting] }
        archived: { type: boolean }
    Account:
      allOf:
        - $ref: "#/components/schemas/AccountInput"
        - type: object
          required: [id, balance, tradingPnl, createdAt]
          properties:
            id: { type: string }
            balance: { type: string }
            tradingPnl: { type: string }
            createdAt: { type: string }
    CashFlowInput:
      type: object
      required: [type, amount, date]
      properties:
        type: { type: string, enum: [deposit, withdrawal, adjustment] }
        amount: { type: string, pattern: "^\\d+(\\.\\d{1,8})?$" }
        date: { type: string, format: date-time }
        note: { type: string, maxLength: 2000 }
    CashFlow:
      allOf:
        - $ref: "#/components/schemas/CashFlowInput"
        - type: object
          required: [id, accountId]
          properties:
            id: { type: string }
            accountId: { type: string }
    ConfluenceInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        category: { type: string, maxLength: 100 }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        enabled: { type: boolean }
        archived: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
    Confluence:
      allOf:
        - $ref: "#/components/schemas/ConfluenceInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    StrategyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 4000 }
        entryRules: { type: string, maxLength: 4000 }
        exitRules: { type: string, maxLength: 4000 }
        riskRules: { type: string, maxLength: 4000 }
        timeframe: { type: string, maxLength: 50 }
        archived: { type: boolean }
    Strategy:
      allOf:
        - $ref: "#/components/schemas/StrategyInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    ExecutionInput:
      type: object
      required: [kind, price, quantity, timestamp]
      properties:
        kind: { type: string, enum: [entry, exit] }
        price: { type: string }
        quantity: { type: string }
        timestamp: { type: string, format: date-time }
        fee: { type: string }
    TradeInput:
      type: object
      required: [status]
      properties:
        accountId: { type: string, format: uuid, description: Optional legacy link. Omit to preserve an existing trade link or automatically resolve an internal journal record for new trades. }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: Trade denomination. Defaults to USD for new trades; an entered trade retains its original currency. }
        status: { type: string, enum: [draft, open, closed] }
        symbol: { type: string, maxLength: 30 }
        assetClass: { type: string, enum: [forex, metals, indices, crypto, futures, stocks] }
        direction: { type: string, enum: [long, short] }
        entryAt: { type: ["string", "null"], format: date-time }
        exitAt: { type: ["string", "null"], format: date-time }
        entryPrice: { type: ["string", "null"] }
        exitPrice: { type: ["string", "null"] }
        stopLoss: { type: ["string", "null"] }
        takeProfit: { type: ["string", "null"] }
        quantity: { type: ["string", "null"] }
        multiplier: { type: ["string", "null"] }
        initialRisk: { type: ["string", "null"] }
        grossPnl: { type: ["string", "null"] }
        commission: { type: string }
        funding: { type: string }
        slippage: { type: string }
        pnlSource: { type: string, enum: [broker, calculated, r] }
        resultR: { type: ["string", "null"], description: Direct net result in R. Required for closed R-only trades. Never interpreted as a currency amount. }
        strategyId: { type: ["string", "null"] }
        timeframe: { type: string, maxLength: 50 }
        higherTimeframe: { type: string, maxLength: 50 }
        session: { type: string, maxLength: 50 }
        regime: { type: string, maxLength: 100 }
        emotion: { type: string, maxLength: 100 }
        confidence: { type: integer, minimum: 1, maximum: 5 }
        grade: { type: string, enum: [A, B, C, D, F] }
        followedPlan: { type: boolean }
        behavioralTags: { type: array, items: { type: string }, maxItems: 20 }
        thesis: { type: string, maxLength: 20000 }
        entryReason: { type: string, maxLength: 20000 }
        management: { type: string, maxLength: 20000 }
        exitReason: { type: string, maxLength: 20000 }
        wentWell: { type: string, maxLength: 20000 }
        wentWrong: { type: string, maxLength: 20000 }
        lesson: { type: string, maxLength: 20000 }
        chartUrl: { type: string, maxLength: 2000 }
        confluenceIds: { type: array, items: { type: string, format: uuid }, maxItems: 30 }
        executions: { type: array, items: { $ref: "#/components/schemas/ExecutionInput" }, maxItems: 100 }
    Trade:
      allOf:
        - $ref: "#/components/schemas/TradeInput"
        - type: object
          required: [id, accountId, accountName, currency, netPnl, realizedR, confluences, createdAt, updatedAt]
          properties:
            id: { type: string }
            accountId: { type: string, format: uuid }
            accountName: { type: string }
            currency: { type: string }
            strategyName: { type: ["string", "null"] }
            netPnl: { type: ["string", "null"] }
            realizedR: { type: ["string", "null"] }
            confluences: { type: array, items: { $ref: "#/components/schemas/Confluence" } }
            createdAt: { type: string }
            updatedAt: { type: string }
    Metrics:
      type: object
      required: [totalTrades, wins, losses, breakeven, winRate, netPnl, averageR, medianR, totalR, profitFactor, maxDrawdown, ruleAdherence, rSample, averageHoldHours, streak]
      properties:
        totalTrades: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        breakeven: { type: integer }
        winRate: { type: ["number", "null"] }
        netPnl: { type: string }
        averageR: { type: ["number", "null"] }
        medianR: { type: ["number", "null"] }
        totalR: { type: number }
        profitFactor: { type: ["number", "null"], description: Null when no losses; see profitFactorInfinite }
        profitFactorInfinite: { type: boolean }
        maxDrawdown: { type: string }
        maxDrawdownPercent: { type: ["number", "null"] }
        ruleAdherence: { type: ["number", "null"] }
        rSample: { type: integer }
        averageHoldHours: { type: ["number", "null"] }
        streak: { type: integer }
    GroupMetrics:
      allOf:
        - $ref: "#/components/schemas/Metrics"
        - type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
            color: { type: string }
            confluenceIds: { type: array, items: { type: string } }
            sampleWarning: { type: boolean }
    EquityPoint:
      type: object
      required: [date, balance, pnl, cumulativeR, drawdown]
      properties:
        date: { type: string }
        balance: { type: number }
        pnl: { type: number }
        cumulativeR: { type: number }
        drawdown: { type: number }
    Analytics:
      type: object
      required: [isDemo, currency, metrics, equity, monthly, byInstrument, byStrategy, byDirection, bySession, byEmotion, byGrade, confluences, combinations, byConfluenceCount, recentTrades, openTrades, warnings]
      properties:
        isDemo: { type: boolean }
        currency: { type: string }
        metrics: { $ref: "#/components/schemas/Metrics" }
        equity: { type: array, items: { $ref: "#/components/schemas/EquityPoint" } }
        monthly: { type: array, items: { $ref: "#/components/schemas/GroupMetrics" } }
        byInstrument: { type: array, items: { $ref: "#/components/schemas/GroupMetrics" } }
        byStrategy: { type: array, items: { $ref: "#/components/schemas/GroupMetrics" } }
        byDirection: { type: array, items: { $ref: "#/components/schemas/GroupMetrics" } }
        bySession: { type: array, items: { $ref: "#/components/schemas/GroupMetrics" } }
        byEmotion: { type: array, items: { $ref: "#/components/schemas/GroupMetrics" } }
        byGrade: { type: array, items: { $ref: "#/components/schemas/GroupMetrics" } }
        confluences: { type: array, items: { $ref: "#/components/schemas/GroupMetrics" } }
        combinations: { type: array, items: { $ref: "#/components/schemas/GroupMetrics" } }
        byConfluenceCount: { type: array, items: { $ref: "#/components/schemas/GroupMetrics" } }
        recentTrades: { type: array, items: { $ref: "#/components/schemas/Trade" } }
        openTrades: { type: integer }
        warnings: { type: array, items: { type: string } }
    Settings:
      type: object
      required: [timezone, riskLimitPercent]
      properties:
        timezone: { type: string, maxLength: 100 }
        riskLimitPercent: { type: string, pattern: "^\\d+(\\.\\d{1,4})?$" }
