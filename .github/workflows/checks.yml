name: Deployment compatibility

on:
  pull_request:
  push:
    branches: [main, chore/vercel-services-setup]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edge_ci
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: edge_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edge_ci -d edge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI database only; never a Supabase or production secret.
      DATABASE_URL: postgresql://edge_ci:local_ci_only@localhost:5432/edge_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:production
      - run: pnpm --filter @workspace/db run test
      - run: pnpm --filter @workspace/db run validate:migrations
        env:
          # Exact ephemeral container created by this job; not a remote-host bypass.
          EDGE_VALIDATION_SERVICE_CONTAINER_ID: ${{ job.services.postgres.id }}
      - run: pnpm run check:deployment
